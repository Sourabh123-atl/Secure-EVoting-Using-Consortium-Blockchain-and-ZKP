services:
  civicchain:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-4173}:4173"
    environment:
      NODE_ENV: development
      PORT: 4173
      CIVICCHAIN_DATA_DIR: /data
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:4173}
      BLOCKCHAIN_RPC_URL: ${BLOCKCHAIN_RPC_URL:-}
      BLOCKCHAIN_CHAIN_ID: ${BLOCKCHAIN_CHAIN_ID:-31337}
      VOTING_CONTRACT_ADDRESS: ${VOTING_CONTRACT_ADDRESS:-}
      ELECTION_REGISTRY_ADDRESS: ${ELECTION_REGISTRY_ADDRESS:-}
      BLOCKCHAIN_ADMIN_PRIVATE_KEY: ${BLOCKCHAIN_ADMIN_PRIVATE_KEY:-}
      BLOCKCHAIN_SUBMITTER_PRIVATE_KEY: ${BLOCKCHAIN_SUBMITTER_PRIVATE_KEY:-}
      BALLOT_ENCRYPTION_PUBLIC_KEY_PATH: ${BALLOT_ENCRYPTION_PUBLIC_KEY_PATH:-data/ballot-public.pem}
      ZK_VERIFICATION_KEY_PATH: ${ZK_VERIFICATION_KEY_PATH:-circuits/build/verification_key.json}
      ZK_WASM_PATH: ${ZK_WASM_PATH:-circuits/build/eligibility_js/eligibility.wasm}
      ZK_ZKEY_PATH: ${ZK_ZKEY_PATH:-circuits/build/eligibility_final.zkey}
      VALIDATOR_RPC_URLS: ${VALIDATOR_RPC_URLS:-}
    volumes:
      - civicchain-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  postgres-scaffold:
    image: postgres:16-alpine
    profiles: ["postgres-scaffold"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-civicchain}
      POSTGRES_USER: ${POSTGRES_USER:-civicchain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - civicchain-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  civicchain-data:
  civicchain-postgres:
